apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: roboshop
  # Deployment labels
  labels:
    component: mysql
    project: roboshop
    tier: database

spec:
  replicas: 1

  # These labels are used by ReplicaSet to select Pods.
  # They must match the Pod template labels.
  selector:
    matchLabels:
      component: mysql
      project: roboshop
      tier: database

  # Pod definition
  template:
    metadata:
      labels:
        component: mysql
        project: roboshop
        tier: database
    spec:
      serviceAccountName: roboshop-mysql-secret-reader
      volumes:
      - name: mysql-secret
        emptyDir: {}
      containers:
        - name: mysql
          image: nginx
      volumeMounts:
        - mountPath: /tmp
          name: mysql-secret
      initContainers:
      - name: fetch-secret
        image: amazon/awscli
        command:
          - sh
          - -c
          - |
            aws secretsmanager get-secret-value \
              --secret-id roboshop/mysql/password \
              --query SecretString \
              --output text \
              --region us-east-1 | jq -r '.MYSQL_ROOT_PASSWORD' > /tmp/mysql_root_password.txt
        volumeMounts:
        - mountPath: /tmp
          name: mysql-secret

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
      component: mysql
      project: roboshop
      tier: database

spec:
  selector:
      component: mysql
      project: roboshop
      tier: database

  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306